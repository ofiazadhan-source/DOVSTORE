<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tindahan ni Dante</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#FFF8E1;padding-bottom:20px}
.topbar{background:#C62828;height:16px;border-radius:0 0 20px 20px}
.wrap{background:#fff;margin:10px;border-radius:22px;border-top:8px solid #C62828;box-shadow:0 4px 14px rgba(0,0,0,.12);padding:14px;min-height:80vh}
h1{text-align:center;color:#C62828;margin:6px 0 2px;font-size:26px}
.sub{text-align:center;color:#666;margin:0 0 14px;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bigbtn{background:linear-gradient(#FFCC80,#FFB74D);border:0;border-radius:16px;padding:22px 8px;font-size:17px;font-weight:bold;color:#B71C1C;cursor:pointer;min-height:110px;line-height:1.3}
.whitebtn{background:#F5F5F5;border:1px solid #999;border-radius:16px;padding:22px 8px;font-size:16px;color:#333;cursor:pointer;min-height:110px}
.topinfo{background:#FFF3E0;border-radius:12px;padding:10px;text-align:center;margin-bottom:12px;font-weight:bold;color:#4E342E}
.topinfo span{color:#C62828;font-size:20px}
</style>
</head>
<body>
<div class="topbar"></div>
<div class="wrap">
  <h1>📋 Main Menu</h1>
  <p class="sub">Welcome to TINDAHAN NI DANTE,</p>
  <div class="topinfo">BENTA NGAYON: <span id="bentaNgayon">Loading...</span><br><small id="stockInfo">Connecting to Firestore...</small></div>
  <div class="grid2">
    <button class="bigbtn" onclick="location.href='pos.html'">DANTE<br>STORE</button>
    <button class="bigbtn" onclick="location.href='products.html'">🛒 Products<br><small>add & edit</small></button>
    <button class="bigbtn" onclick="location.href='expenses.html'">💸 Daily<br>Expenses</button>
    <button class="bigbtn" onclick="showProfit()">📈 Net<br>Profit</button>
    <button class="bigbtn" onclick="showReport()">Report<br>Card</button>
    <button class="whitebtn" onclick="location.href='pos.html'">🎁 Transfer History</button>
  </div>
</div>

<script type="module">
import { db } from './firebase-config.js';
import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

let total = 0;
try{
  const snap = await getDocs(collection(db, "sales"));
  snap.forEach(d=>{ total += d.data().total || 0; });
  document.getElementById('bentaNgayon').innerText = '₱'+total;
  const psnap = await getDocs(collection(db, "products"));
  let low = 0; let count = 0;
  psnap.forEach(d=>{ count++; if((d.data().stock||0)<=3) low++; });
  document.getElementById('stockInfo').innerText = count+' products • '+low+' paubos na • Firestore Connected ✓';
  window._total = total;
}catch(e){
  document.getElementById('stockInfo').innerText = 'Hindi makakonek sa Firestore. Check internet.';
  window._total = 0;
}
window.showProfit = ()=> alert('Benta: ₱'+(window._total||0));
window.showReport = ()=> alert('REPORT CARD\n\nBenta: ₱'+(window._total||0));
</script>
</body>
</html>
